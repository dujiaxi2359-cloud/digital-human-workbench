name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON
        run: node -e "for (const file of ['.mcp.json','package.json','agent/manifest.json','agent-runtime/config.example.json','agent-runtime/job-state.example.json','agent-runtime/inbox.example.json']) JSON.parse(require('fs').readFileSync(file,'utf8'))"

      - name: Validate source syntax
        run: |
          node --check server/index.mjs
          python3 -m py_compile mcp/digital_human_server.py rachel-skill/scripts/preflight_assets.py rachel-skill/scripts/init_job_state.py

      - name: Build
        run: npm run build

      - name: Check public release boundary
        run: npm run check:release

      - name: Audit dependencies
        run: npm audit --audit-level=high
