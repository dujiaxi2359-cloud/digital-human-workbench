<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">数字人工作台生产流程</title>
  <desc id="desc">从素材检查到预览审批再到最终成片的五阶段工作流。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1f23"/><stop offset="1" stop-color="#343941"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="760" rx="32" fill="url(#canvas)"/>
  <rect x="50" y="44" width="1500" height="164" rx="24" fill="url(#hero)"/>
  <text x="94" y="91" fill="#aeb7c4" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">DIGITAL HUMAN WORKBENCH</text>
  <text x="94" y="143" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">从素材到可交付成片</text>
  <text x="94" y="177" fill="#c8ced7" font-family="Arial, sans-serif" font-size="17">Skill 驱动 · Agent 编排 · MCP 工具 · 审批门禁</text>
  <rect x="1210" y="78" width="270" height="96" rx="16" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/>
  <text x="1235" y="113" fill="#aeb7c4" font-family="Arial, sans-serif" font-size="13">CURRENT MODE</text>
  <text x="1235" y="148" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">SAFE DRY-RUN</text>
  <line x1="115" y1="389" x2="1485" y2="389" stroke="#c8d0da" stroke-width="4"/>
  <g filter="url(#shadow)">
    <g transform="translate(70 268)"><rect width="260" height="240" rx="20" fill="#fff"/><circle cx="42" cy="44" r="24" fill="#e9f5ec"/><text x="34" y="52" fill="#36a35b" font-family="Arial" font-size="22" font-weight="700">1</text><text x="32" y="106" fill="#1d2025" font-family="Arial" font-size="21" font-weight="700">素材检查</text><text x="32" y="138" fill="#697382" font-family="Arial" font-size="15">头像 · 声音 · 脚本</text><rect x="32" y="176" width="196" height="9" rx="5" fill="#dcefe1"/><rect x="32" y="176" width="196" height="9" rx="5" fill="#57b76f"/></g>
    <g transform="translate(350 268)"><rect width="260" height="240" rx="20" fill="#fff"/><circle cx="42" cy="44" r="24" fill="#e9f5ec"/><text x="34" y="52" fill="#36a35b" font-family="Arial" font-size="22" font-weight="700">2</text><text x="32" y="106" fill="#1d2025" font-family="Arial" font-size="21" font-weight="700">克隆配音</text><text x="32" y="138" fill="#697382" font-family="Arial" font-size="15">MiniMax · 旁白</text><path d="M32 185h12m10 0h7m11 0h22m12 0h8m12 0h25m12 0h10m13 0h24" stroke="#2879e7" stroke-width="8" stroke-linecap="round"/></g>
    <g transform="translate(630 268)"><rect width="260" height="240" rx="20" fill="#fff"/><circle cx="42" cy="44" r="24" fill="#e9f5ec"/><text x="34" y="52" fill="#36a35b" font-family="Arial" font-size="22" font-weight="700">3</text><text x="32" y="106" fill="#1d2025" font-family="Arial" font-size="21" font-weight="700">15 秒预览</text><text x="32" y="138" fill="#697382" font-family="Arial" font-size="15">HeyGen · 低分辨率</text><rect x="32" y="169" width="196" height="42" rx="10" fill="#eef3f8"/><circle cx="60" cy="190" r="12" fill="#2879e7"/><path d="m57 183 10 7-10 7Z" fill="#fff"/></g>
    <g transform="translate(910 268)"><rect width="260" height="240" rx="20" fill="#fff" stroke="#2879e7" stroke-width="2"/><circle cx="42" cy="44" r="24" fill="#e8f1ff"/><text x="34" y="52" fill="#2879e7" font-family="Arial" font-size="22" font-weight="700">4</text><text x="32" y="106" fill="#1d2025" font-family="Arial" font-size="21" font-weight="700">审批确认</text><text x="32" y="138" fill="#697382" font-family="Arial" font-size="15">口型 · 声音 · 内容</text><rect x="32" y="171" width="196" height="40" rx="10" fill="#2879e7"/><text x="69" y="197" fill="#fff" font-family="Arial" font-size="14" font-weight="700">用户明确确认</text></g>
    <g transform="translate(1190 268)"><rect width="260" height="240" rx="20" fill="#fff"/><circle cx="42" cy="44" r="24" fill="#f0f1f3"/><text x="34" y="52" fill="#697382" font-family="Arial" font-size="22" font-weight="700">5</text><text x="32" y="106" fill="#1d2025" font-family="Arial" font-size="21" font-weight="700">成片生成</text><text x="32" y="138" fill="#697382" font-family="Arial" font-size="15">1080P · MP4</text><rect x="32" y="176" width="196" height="9" rx="5" fill="#eef0f3"/></g>
  </g>
  <g fill="#8a95a3"><path d="m331 382 15-9v7h18v4h-18v7Z"/><path d="m611 382 15-9v7h18v4h-18v7Z"/><path d="m891 382 15-9v7h18v4h-18v7Z"/><path d="m1171 382 15-9v7h18v4h-18v7Z"/></g>
  <text x="80" y="624" fill="#697382" font-family="Arial, sans-serif" font-size="16">每个阶段都有前置条件；只有预览完成并通过审批，最终成片才会解锁。</text>
  <text x="80" y="667" fill="#2879e7" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">RACHEL SKILL  ×  MCP  ×  AGENT</text>
